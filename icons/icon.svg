<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0b45a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a227;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="64"/>
  <!-- 龙的抽象图形 -->
  <g transform="translate(256, 256)">
    <!-- 龙身 -->
    <path d="M -120 40 Q -80 -20 -40 0 Q 0 20 40 -10 Q 80 -40 120 -20" 
          stroke="url(#gold)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- 龙头 -->
    <circle cx="120" cy="-20" r="24" fill="url(#gold)"/>
    <!-- 龙眼 -->
    <circle cx="128" cy="-26" r="4" fill="#1a1a2e"/>
    <!-- 龙角 -->
    <path d="M 110 -40 L 100 -60 M 130 -40 L 140 -60" 
          stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <!-- 龙尾 -->
    <path d="M -120 40 L -140 60 M -120 40 L -130 70" 
          stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <!-- 龙鳞装饰 -->
    <circle cx="-80" cy="0" r="6" fill="url(#gold)" opacity="0.6"/>
    <circle cx="-40" cy="10" r="6" fill="url(#gold)" opacity="0.6"/>
    <circle cx="0" cy="5" r="6" fill="url(#gold)" opacity="0.6"/>
    <circle cx="40" cy="-15" r="6" fill="url(#gold)" opacity="0.6"/>
    <circle cx="80" cy="-30" r="6" fill="url(#gold)" opacity="0.6"/>
  </g>
  <!-- 文字 -->
  <text x="256" y="420" text-anchor="middle" fill="url(#gold)" 
        font-family="serif" font-size="36" font-weight="bold">龙族世界</text>
</svg>
